const IMG = id => c => "https://spnati.net/opponents/" + c.id + "/" + c.pic;

function render() {
  const kw = q.value.trim().toLowerCase();
  const list = CHARS.filter(c => {
    if (gender.value && c.gender !== gender.value) return false;
    if (statusSel.value && c.status !== statusSel.value) return false;
    if (kw && !(c.label + " " + c.name + " " + c.from + " " + c.writer + " " + c.id).toLowerCase().includes(kw)) return false;
    return true;
  });
  document.getElementById('count').textContent = "显示 " + list.length + " 个角色";
  grid.innerHTML = list.map((c, i) => `
    <div class="card" data-idx="${CHARS.indexOf(c)}">
      <img loading="lazy" src="${IMG()(c)}" alt="${c.label}">
      <div class="info"><div class="label">${c.label}</div>
      <div class="from">${c.from || ""}</div>
      <span class="tag">${c.gender === "female" ? "女" : c.gender === "male" ? "男" : c.gender}</span>
      <span class="tag">${statusZh[c.status] || c.status}</span>

}

    "出处：" + (c.from || "—") + "<br>性别：" + (c.gender === "female" ? "女" : c.gender === "male" ? "男" : c.gender) +
    " · 阵容：" + (statusZh[c.status] || c.status) + "<br>衣物层数：" + c.layers + " · 专属台词：" + c.lines + " 条 · 姿势：" + c.poses +
    "<br>编剧：" + (c.writer || "—") + "<br>画师：" + (c.artist || "—");
  document.getElementById('dDesc').textContent = c.desc || "";
  document.getElementById('detail').style.display = "block";
  renderExtra(c);
}
document.getElementById('closeDetail').onclick = () => document.getElementById('detail').style.display = "none";
document.getElementById('detail').onclick = e => { if (e.target.id === 'detail') e.target.style.display = "none"; };
[q, gender, statusSel].forEach(el => el.addEventListener('input', render));
render();
</script>
</body>
</html>
